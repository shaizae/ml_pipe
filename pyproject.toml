[project]
name = "ml-pipe"
version = "0.1.0"
description = "A machine learning pipeline library for feature selection and classification"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    {name = "Shai Zaedman"}
]

dependencies = [
    "charset-normalizer==3.4.7",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "fonttools==4.63.0",
    "joblib==1.5.3",
    "kiwisolver==1.5.0",
    "matplotlib==3.11.0",
    "narwhals==2.22.1",
    "numpy==2.5.1",
    "packaging==26.2",
    "pandas==3.0.3",
    "pillow==12.3.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "reportlab==5.0.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "six==1.17.0",
    "threadpoolctl==3.6.0",
    "tqdm==4.68.4",
    "tzdata==2026.3"
]


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.14.1",
    "pandas-stubs==3.0.3.260530"
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "classificetin_files*",
    "utils*"
]